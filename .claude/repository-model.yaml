analysis:
  purpose:
    value: Eclipse IoT Packages provides Helm charts and multi-project packages so Eclipse IoT stacks (Hono, Ditto, hawkBit, and end-to-end scenarios) can be deployed on Kubernetes, plus a Jekyll site that documents and publishes those charts.
    confidence: high
    evidence_refs:
      - entry-homepage-index
      - comp-chart-hono
      - comp-chart-hawkbit
      - comp-pkg-cloud2edge
  architecture:
    value: "Single repo with three layers: charts/* are individual Eclipse IoT Helm charts; packages/* compose charts into end-to-end scenarios (cloud2edge = Hono+Ditto; telemetry-e2e = Drogue/Kafka/Ditto/etc.); homepage is a Jekyll site. GitHub Actions runs chart-testing and kubeval on charts/packages; Jenkins packages charts and publishes the website/helm repo on master."
    confidence: high
    evidence_refs:
      - comp-chart-hawkbit
      - comp-chart-hono
      - comp-pkg-cloud2edge
      - comp-pkg-telemetry-e2e
      - comp-homepage
      - entry-ci-workflow
      - entry-jenkinsfile
  patterns:
    - id: pat-helm-profiles
      value: Optional deploy profiles as sibling *-values.yaml files applied with helm -f (AMQP messaging, OpenShift, tracing, monitoring).
      confidence: high
      evidence_refs:
        - comp-pkg-cloud2edge
        - comp-chart-hono
    - id: pat-post-install-hooks
      value: Packages use Helm post-install Jobs to seed demo devices, credentials, and cross-service connections after chart install.
      confidence: high
      evidence_refs:
        - comp-pkg-cloud2edge
        - entry-pkg-cloud2edge
    - id: pat-chart-ci-matrix
      value: CI lints bash, runs ct lint, kubeval across Kubernetes versions, then ct install on kind with ingress-nginx when charts change.
      confidence: high
      evidence_refs:
        - entry-ci-workflow
        - test-chart-testing
        - test-kubeval
    - id: pat-eca-signed-commits
      value: Contributions require Eclipse ECA and git commit -s sign-off; commit messages prefer [#issue] prefixes.
      confidence: high
      evidence_refs:
        - entry-contributing
  component_notes:
    - ref: comp-chart-hawkbit
      purpose: Helm chart for Eclipse hawkBit software-update server, with MariaDB/RabbitMQ dependencies, optional microservices, GUI, and DB migrate pre-install Job.
      confidence: high
    - ref: comp-chart-hono
      purpose: Primary Helm chart for Eclipse Hono device connectivity (MQTT/HTTP/AMQP/CoAP/LoRa adapters, device registry, Kafka or AMQP messaging, optional monitoring).
      confidence: high
    - ref: comp-chart-ditto
      purpose: Deprecated local Ditto digital-twins chart retained in-repo; upstream chart now lives in eclipse-ditto/ditto and Docker Hub OCI.
      confidence: high
    - ref: comp-pkg-cloud2edge
      purpose: Package chart composing Hono and Ditto with post-install wiring for a cloud-to-edge demo scenario.
      confidence: high
    - ref: comp-pkg-telemetry-e2e
      purpose: End-to-end telemetry example spanning sensor/gateway/cloud tiers using Drogue Cloud, Strimzi Kafka, Ditto, and Streamsheets.
      confidence: high
    - ref: comp-homepage
      purpose: Jekyll site for eclipse.dev/packages documentation and published Helm chart repository content.
      confidence: high
  service_notes:
    - ref: svc-kubernetes
      integration: Charts and packages target Kubernetes; CI creates kind clusters for install tests.
      confidence: high
    - ref: svc-helm-chart-repos
      integration: ct.yaml and kubeval.sh register external Helm repos needed to resolve chart dependencies during lint/install.
      confidence: high
    - ref: svc-oci-registries
      integration: Several Chart.yaml dependencies pull from OCI registries (Docker Hub bitnami/cloudpirates/eclipse).
      confidence: high
    - ref: svc-github-actions
      integration: Pull requests touching charts/** or packages/** trigger lint, kubeval, and install jobs.
      confidence: high
    - ref: svc-jenkins
      integration: Jenkins builds Helm packages and the Jekyll site; on master it merges new charts into the website helm repo and pushes packages-website.
      confidence: high
  dangerous_areas:
    - id: danger-hawkbit-db-migrate
      value: hawkBit DB migrate Helm/ArgoCD pre-sync Job plus Deployment updateStrategy Recreate
      reason: Installs/upgrades run a migrate Job before pods; Recreate strategy tears down all pods during upgrades, so a failed migrate or long downtime can break rolling continuity.
      confidence: high
      evidence_refs:
        - comp-chart-hawkbit
        - entry-chart-hawkbit
    - id: danger-demo-credentials
      value: Default demo passwords in chart/package values
      reason: values.yaml files ship plaintext demo credentials (e.g. hawkbit admin/{noop}admin, cloud2edge demo-secret/verysecret) unsuitable for production without override.
      confidence: high
      evidence_refs:
        - comp-chart-hawkbit
        - comp-pkg-cloud2edge
    - id: danger-packages-excluded-ci
      value: cloud2edge and telemetry-e2e excluded from chart-testing
      reason: .github/ct.yaml excluded-charts skips both packages, so CI lint/install coverage does not exercise those composed packages.
      confidence: high
      evidence_refs:
        - test-chart-testing
        - entry-ci-workflow
    - id: danger-hawkbit-external-test-deps
      value: hawkbit render/live tests depend on out-of-repo paths and LVT hosts
      reason: render-test.sh reads $HOME/src/argocd/values/infrastructure/hawkbit; live-test.sh hits LVT URLs and Vault paths not present in this repo.
      confidence: high
      evidence_refs:
        - test-hawkbit-render
        - comp-chart-hawkbit
    - id: danger-ditto-deprecated
      value: Local charts/ditto is marked deprecated
      reason: Chart.yaml sets deprecated true and README points to eclipse-ditto/ditto; editing this copy may not affect the published OCI chart cloud2edge depends on.
      confidence: high
      evidence_refs:
        - comp-chart-ditto
        - dep-ditto-oci
  questions:
    - id: q-lvt-overlay-scope
      question: hawkbit_resources.yaml and AGENTS.MD describe LiveViewTech ArgoCD/Vault/Terraform/ExternalSecrets environments (devops/int/stg/prd) that are not explained by the Eclipse IoT Packages README. What is the intended ownership boundary between upstream Eclipse packaging and this fork's LVT hawkBit ops overlay?
      area: ownership
      priority: high
      evidence_refs:
        - comp-chart-hawkbit
        - entry-chart-hawkbit
    - id: q-telemetry-ci-exclusion-why
      question: Why are telemetry-e2e and cloud2edge listed under excluded-charts in .github/ct.yaml — resource cost, flakiness, or intentional non-maintenance?
      area: ci
      priority: medium
      evidence_refs:
        - test-chart-testing
    - id: q-ditto-local-vs-oci
      question: Should charts/ditto remain in this repo for reference only, or is there still a publish path for it via Jenkins helm package that conflicts with the deprecated/OCI guidance?
      area: packaging
      priority: medium
      evidence_refs:
        - comp-chart-ditto
        - entry-jenkinsfile
        - dep-ditto-oci
    - id: q-hawkbit-resources-accuracy
      question: Can the LVT paths and hostnames in hawkbit_resources.yaml and charts/hawkbit/test/live-test.sh be independently verified from this sandbox, or should agents treat that registry as fork-local ops documentation only?
      area: ops-docs
      priority: high
      evidence_refs:
        - test-hawkbit-render
        - comp-chart-hawkbit
